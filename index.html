<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ธรณีพิบัติภัย 3D</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;font-size:16px;line-height:1.65;color:#dfe9f3;background:#07131f}*{box-sizing:border-box}

const CH=[
{n:'แผ่นดินไหว',h:'พลังงานที่สะสมตรงรอยเลื่อน',t:'การเคลื่อนที่ของแผ่นธรณีภาคทำให้หินตรงรอยเลื่อนสะสมพลังงาน เมื่อหินทนไม่ไหวจะเลื่อนตัวและปลดปล่อยพลังงานเป็นคลื่นไหวสะเทือน ได้แก่ คลื่นในตัวกลาง (P และ S) และคลื่นพื้นผิว (L และ R)',o:'ขนาด (Magnitude) วัดพลังงานด้วยมาตราริกเตอร์หรือโมเมนต์มาตรา ส่วนความรุนแรงวัดความเสียหายด้วยมาตราเมอร์คัลลี่ 12 ระดับ ค่าขนาดเพิ่ม 1 หน่วย พลังงานเพิ่มประมาณ 32 เท่า',s:[['ขนาดแผ่นดินไหว (M)',3,9,6,.1]],r:v=>`พลังงานมากกว่า M3 ≈ ${Math.round(Math.pow(31.6,v[0]-3)).toLocaleString('th-TH')} เท่า`,cam:15},
{n:'ภูเขาไฟระเบิด',h:'แมกมาดันตัวขึ้นสู่ผิวโลก',t:'แมกมาจากใต้เปลือกโลกดันตัวขึ้นตามปล่อง ความดันและความหนืดกำหนดความรุนแรงของการปะทุ ภูเขาไฟพบมากที่วงแหวนไฟรอบแปซิฟิก แนวเทือกเขาแอลป์-หิมาลัย และจุดร้อน',o:'ผลกระทบสำคัญคือ ลาวา เถ้าถ่าน ก๊าซพิษ และโคลนภูเขาไฟ',s:[['ความดันแมกมา',1,10,5,1]],r:v=>v[0]<4?'ปะทุเบา ไอน้ำและก๊าซ':v[0]<8?'ปะทุปานกลาง เถ้าถ่านลอยสูง':'ปะทุรุนแรง เถ้าแผ่กว้าง',cam:15},
{n:'สึนามิ',h:'คลื่นจากการแทนที่ของมวลน้ำ',t:'สึนามิเกิดจากมวลน้ำถูกแทนที่อย่างกะทันหัน เช่น แผ่นดินไหวใต้ทะเล ดินถล่ม หรือภูเขาไฟระเบิดใต้ทะเล ในน้ำลึกคลื่นเคลื่อนเร็วมากแต่สูงไม่มาก เมื่อเข้าน้ำตื้นความเร็วลดลงแต่ความสูงเพิ่มขึ้นอย่างรวดเร็ว',o:'ความเร็วคลื่นน้ำตื้น v ≈ √(g·d) ระบบเตือนภัยใช้ทุ่น DART และดาวเทียม',s:[['ความลึกน้ำ (เมตร)',20,5000,4000,20]],r:v=>`ความเร็ว ≈ ${Math.round(Math.sqrt(9.81*v[0])*3.6).toLocaleString('th-TH')} กม./ชม.`,cam:19},
{n:'ดินถล่มและโคลนถล่ม',h:'เมื่อความลาดชันพบฝนสะสม',t:'ดินถล่มเกิดจากความลาดชัน ชนิดของหินและดิน ปริมาณน้ำฝนสะสมที่ทำให้ดินอิ่มน้ำ และการขาดพืชคลุมดิน น้ำทำให้ดินหนักขึ้นและแรงเสียดทานลดลง',o:'พื้นที่เสี่ยงในไทยคือจังหวัดที่มีภูเขาลาดชัน สัญญาณเตือนเบื้องต้น เช่น น้ำขุ่น ต้นไม้เอียง รอยแตกบนพื้นดิน',s:[['ความลาดชัน (องศา)',10,60,25,1],['ฝนสะสม (ระดับ)',0,10,3,1]],r:v=>{const k=v[0]*(1+v[1]*.07);return k>40?'เสี่ยงสูง ดินเคลื่อนตัว':k>30?'เสี่ยงปานกลาง':'เสี่ยงต่ำ'},cam:15},
{n:'หลุมยุบและแผ่นดินทรุด',h:'ใต้ดินกลวง พื้นดินพัง',t:'หลุมยุบเกิดเมื่อหินปูนหรือโดโลไมต์ใต้ดินถูกน้ำใต้ดินกัดเซาะเป็นโพรง จนชั้นดินด้านบนรับน้ำหนักไม่ไหว ส่วนแผ่นดินทรุดมักเกิดจากการสูบน้ำบาดาลหรือน้ำผิวดินเกินพิกัดในเขตเมืองหรือที่ราบลุ่ม',o:'การสูบน้ำมากเกินไปทำให้ระดับน้ำใต้ดินลดลง ชั้นดินเสียแรงพยุงและโพรงขยายตัว',s:[['ระดับน้ำใต้ดินที่ลดลง',0,10,2,1]],r:v=>v[0]>=7?'พื้นดินยุบเป็นหลุม':v[0]>=4?'โพรงขยาย เสี่ยงยุบ':'โพรงเล็ก ยังทรงตัว',cam:14},
{n:'การกัดเซาะชายฝั่ง',h:'คลื่น ลม กระแสน้ำ และมนุษย์',t:'ชายฝั่งถูกกัดเซาะด้วยคลื่น ลม และกระแสน้ำ กิจกรรมของมนุษย์เร่งปัญหา เช่น สร้างเขื่อนหรือท่าเรือที่ขวางการเคลื่อนที่ของตะกอน และการบุกรุกป่าชายเลน',o:'ป่าชายเลนช่วยลดพลังงานคลื่นและยึดตะกอน จึงชะลอการถอยร่นของแนวชายฝั่ง',s:[['ความหนาแน่นป่าชายเลน',0,10,2,1]],r:v=>`ชายฝั่งถอยร่น ≈ ${((10-v[0])*.5).toFixed(1)} หน่วยต่อรอบปี (แบบจำลอง)`,cam:16},
{n:'การรับมือภัยพิบัติ',h:'อ่านแผนที่เสี่ยง วางแผนอพยพ',t:'การรับมือเริ่มจากอ่านแผนที่ความเสี่ยงภัยพิบัติ สังเกตสัญญาณเตือนจากธรรมชาติ ปฏิบัติตนอย่างปลอดภัย และวางแผนอพยพไปยังที่สูงหรือศูนย์พักพิง',o:'ในแบบจำลอง ช่องสีแดงคือพื้นที่น้ำท่วม สีเหลืองคือพื้นที่เฝ้าระวัง สีเขียวคือพื้นที่ปลอดภัย',s:[['ระดับน้ำท่วม (เมตร)',0,6,2,.5]],r:v=>{const q=L7(v[0]);return `พื้นที่ปลอดภัย ${q}%`},cam:16}
];
function L7(f){let ok=0,all=0;for(let i=0;i<9;i++)for(let j=0;j<9;j++){all++;if(.3+i*.35+((j*7+i*3)%5)*.04>f+1)ok++}return Math.round(ok/all*100)}

const Q=[[0,'คลื่นไหวสะเทือนชนิดใดเป็นคลื่นในตัวกลาง?',['คลื่น P และ S','คลื่น L และ R','คลื่นวิทยุ'],0,'คลื่น P และ S เดินทางผ่านภายในโลก ส่วน L และ R เป็นคลื่นพื้นผิว'],
[0,'มาตราใดวัดความรุนแรงของความเสียหาย?',['ริกเตอร์','โมเมนต์มาตรา','เมอร์คัลลี่'],2,'เมอร์คัลลี่ 12 ระดับ วัดความเสียหาย'],
[0,'ขนาดแผ่นดินไหวเพิ่ม 1 หน่วย พลังงานเพิ่มประมาณกี่เท่า?',['2 เท่า','10 เท่า','32 เท่า'],2,'พลังงานเพิ่มประมาณ 10^1.5 ≈ 32 เท่า'],
[1,'วงแหวนไฟ (Ring of Fire) อยู่บริเวณใด?',['มหาสมุทรแปซิฟิก','มหาสมุทรอาร์กติก','ทะเลทรายสะฮารา'],0,'ภูเขาไฟและแผ่นดินไหวเรียงตัวรอบขอบแปซิฟิก'],
[1,'ปัจจัยใดกำหนดความรุนแรงการปะทุของภูเขาไฟ?',['สีของแมกมา','ความดันและความหนืด','ความสูงของภูเขา'],1,'ความดันและความหนืดของแมกมาควบคุมการปะทุ'],

[2,'อุปกรณ์ใดใช้เตือนภัยสึนามิกลางมหาสมุทร?',['ทุ่น DART','เครื่องวัดฝน','เสาอากาศวิทยุ'],0,'ทุ่น DART ตรวจวัดการเปลี่ยนแปลงความดันน้ำ'],
[3,'น้ำฝนสะสมทำให้เกิดดินถล่มได้เพราะเหตุใด?',['ดินแห้งขึ้น','ดินหนักขึ้นและเสียดทานลดลง','ความลาดชันลดลง'],1,'ดินอิ่มน้ำมีน้ำหนักมากและยึดเกาะน้อยลง'],
